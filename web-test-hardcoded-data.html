<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindMe</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#" id="nav-brand">FindMe</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#" id="menu-home">HomePage</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="menu-found">분실물 찾았어요</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="menu-find">분실물 찾아주세요</a>    
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 동적으로 내용이 바뀌는 메인 콘텐츠 영역 -->
    <div class="container mt-5" id="main-content">
        <h1>FindMe에 오신 것을 환영합니다!</h1>
        <p>상단 메뉴를 통해 분실물 정보를 확인하거나 등록해보세요.</p>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- 싱글 페이지 전환 및 상세 화면 스크립트 -->
    <script>
        const contentArea = document.getElementById('main-content');
        const homeBtn = document.getElementById('menu-home');
        const foundBtn = document.getElementById('menu-found');
        const findBtn = document.getElementById('menu-find');
        const brandBtn = document.getElementById('nav-brand');

        function updateActiveMenu(selectedBtn) {
            document.querySelectorAll('.navbar-nav .nav-link').forEach(link => {
                link.classList.remove('active');
            });
            if (selectedBtn) selectedBtn.classList.add('active');
        }

        // 1. 홈 화면 함수
        function renderHome() {
            updateActiveMenu(homeBtn);
            contentArea.innerHTML = `
                <h1>FindMe에 오신 것을 환영합니다!</h1>
                <p>상단 메뉴를 통해 분실물 정보를 확인하거나 등록해보세요.</p>
            `;
        }

        homeBtn.addEventListener('click', (e) => {
            e.preventDefault();
            renderHome();
        });

        brandBtn.addEventListener('click', (e) => {
            e.preventDefault();
            renderHome();
        });

        // 게시판 데이터 불러오기
        function renderPostList(type) {
            // 1. 어떤 메뉴를 눌렀느냐에 따라 활성화
            let activeBtn, pageTitle, mockItems;

            const foundBtn = document.getElementById('menu-found');
            const findBtn = document.getElementById('menu-find');

            if (type === 'found') {
                activeBtn = foundBtn;
                pageTitle = "찾았으니 가져강";
                mockItems = [
                    {
                        id: 1,
                        title: "[AirPods] 학생회관 앞에서 주웠습니다.",
                        image: "https://via.placeholder.com/400x300?text=AirPods+Image",
                        content: "학생회관 앞 벤치 위에서 발견했습니다."
                    },
                    {
                        id: 2,
                        title: "[지갑] 중앙도서관 2층 리딩존입니다.",
                        image: "https://via.placeholder.com/400x300?text=Wallet+Image",
                        content: "검은색 가죽 지갑이고 학생증 들어있습니다."
                    }
                ];
            } 
            else {
                activeBtn = findBtn;
                pageTitle = "잃어버린거 찾아줭";
                mockItems = [
                    {
                        id: 101,
                        title: "[가방] 도서관에서 노트북 가방을 잃어버렸습니다.",
                        image: "https://via.placeholder.com/400x300?text=Lost+Bag",
                        content: "회색 백팩입니다. 안에 노트북이 있어요. 제발 찾아주세요!"
                    },
                    {
                        id: 102,
                        title: "[텀블러] 학생식당에 두고 온 것 같아요.",
                        image: "https://via.placeholder.com/400x300?text=Tumbler",
                        content: "스타벅스 흰색 텀블러입니다."
                    }
                ];
            }

            updateActiveMenu(activeBtn);

            // 2. HTML 리스트
            let htmlList = `
                <h2>${pageTitle}</h2>
                <hr>
                <div class="list-group">
            `;
    
            mockItems.forEach((item) => {
                htmlList += `
                    <a href="#" class="list-group-item list-group-item-action item-link" data-id="${item.id}">
                        ${item.title}
                    </a>
                `;
            });
            htmlList += `</div>`;

            contentArea.innerHTML = htmlList;

            // 3. 리스트 클릭 시 상세 화면으로 전환하는 이벤트 연결 (데이터 배열을 함께 전달하거나 공유)
            document.querySelectorAll('.item-link').forEach(element => {
                element.addEventListener('click', function(event) {
                    event.preventDefault();
                    const itemId = Number(this.getAttribute('data-id'));
                    const selectedItem = mockItems.find(i => i.id === itemId);

                    // 상세 보기 렌더링 (목록으로 돌아갈 때 현재 어떤 타입이었는지 유지할 수도 있습니다)
                    renderDetailView(selectedItem, type);
                });
            });
        }

        foundBtn.addEventListener('click', (e) => {
            e.preventDefault();
            renderPostList('found');
        });

        findBtn.addEventListener('click', (e) => {
            e.preventDefault();
            renderPostList('find');
        });

        // 4. 상세 보기 화면 함수
        function renderDetailView(item, type) {
            updateActiveMenu(null); // 상세 화면이므로 메뉴 활성화 해제 혹은 유지 가능
            
            contentArea.innerHTML = `
                <button class="btn btn-secondary mb-3" id="back-to-list">← 목록으로 돌아가기</button>
                <div class="card shadow-sm">
                    <div class="row g-0">
                        <!-- 사진 영역 -->
                        <div class="col-md-5 text-center bg-light d-flex align-items-center justify-content-center p-3">
                            <img src="${item.image}" alt="분실물 사진" class="img-fluid rounded" style="max-height: 300px;">
                        </div>
                        <!-- 글 내용 영역 -->
                        <div class="col-md-7">
                            <div class="card-body">
                                <h3 class="card-title">${item.title}</h3>
                                <hr>
                                <p class="card-text">${item.content}</p>
                                <p class="text-muted small mt-4">등록일: 2026-06-07</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // '목록으로 돌아가기' 버튼 이벤트
            document.getElementById('back-to-list').addEventListener('click', (e) => {
                e.preventDefault();
                renderPostList(type);
            });
        }
    </script>
</body>
</html>
